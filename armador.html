<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Armador de fotos — O'Neill Chiclayo</title>
<link rel="icon" type="image/png" href="favicon.png">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">
<style>
:root{--n:#0B0B0B;--g1:#6B6B6B;--g2:#A3A3A3;--lin:#E6E6E4;--hum:#F5F5F3;--wa:#25D366}
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:Inter,-apple-system,sans-serif;background:var(--hum);color:var(--n);
 line-height:1.55;font-size:16px;-webkit-font-smoothing:antialiased;padding-bottom:40px}
.w{max-width:980px;margin:0 auto;padding:0 16px}
header{background:var(--n);color:#fff;padding:22px 0}
header .w{display:flex;align-items:center;gap:10px}
header img{height:22px}
header .bar{width:1px;height:18px;background:rgba(255,255,255,.3)}
header b{font-size:15px;font-weight:900;text-transform:uppercase;letter-spacing:.01em}
header span{margin-left:auto;font-size:11px;letter-spacing:.16em;text-transform:uppercase;color:#A3A3A3}
.panel{background:#fff;border:1px solid var(--lin);margin-top:18px;padding:18px}
.fila{display:grid;gap:10px;grid-template-columns:1fr}
label{display:block;font-size:10.5px;font-weight:800;letter-spacing:.18em;text-transform:uppercase;
 color:var(--g1);margin-bottom:6px}
select,input{width:100%;border:1px solid var(--lin);padding:12px;font-size:15px;background:#fff;border-radius:0}
select:focus,input:focus{outline:0;border-color:var(--n)}
.acc{display:flex;gap:8px;margin-top:14px;flex-wrap:wrap}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;padding:14px 20px;
 font-weight:800;font-size:12.5px;letter-spacing:.11em;text-transform:uppercase;border:0;cursor:pointer}
.b-neg{background:var(--n);color:#fff}.b-neg:disabled{opacity:.35;cursor:default}
.b-wa{background:var(--wa);color:#04210E}
.b-lin{background:#fff;color:var(--n);border:1px solid var(--n)}
.cuenta{margin-top:14px;font-size:14px;color:var(--g1)}
.cuenta b{color:var(--n)}
.prev{display:grid;grid-template-columns:repeat(3,1fr);gap:2px;margin-top:14px}
.prev .c{background:var(--hum);border:1px solid var(--lin);padding:6px;text-align:center;position:relative}
.prev img{width:100%;aspect-ratio:1/1;object-fit:contain}
.prev small{display:block;font-size:10px;line-height:1.3;margin-top:4px;color:var(--g1);
 overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.prev .x{position:absolute;top:2px;right:2px;width:22px;height:22px;background:#fff;border:1px solid var(--lin);
 font-size:13px;line-height:20px;cursor:pointer;font-weight:700}
.prev .c.off{opacity:.28}
.hojas{margin-top:18px;display:grid;gap:14px}
.hoja{background:#fff;border:1px solid var(--lin);padding:12px}
.hoja img{width:100%;border:1px solid var(--lin)}
.hoja .acc{margin-top:10px}
.nota{font-size:13px;color:var(--g1);margin-top:10px;line-height:1.6}
.cargando{padding:30px;text-align:center;color:var(--g1);font-size:14px}
@media(min-width:720px){.fila{grid-template-columns:1.2fr 1fr 1fr .8fr}.prev{grid-template-columns:repeat(6,1fr)}}
</style>
</head>

const MARCAS=['OAKLEY','DRAGON','ARNETTE','BOLLE','FERRARI','QUIKSILVER','ROXY','VOLCOM','HAWAIIAN','VEECE','ONEILL','REEF','HUBBLITE'];
const BON={OAKLEY:'Oakley',DRAGON:'Dragon',ARNETTE:'Arnette',BOLLE:'Bollé',FERRARI:'Ferrari',QUIKSILVER:'Quiksilver',
 ROXY:'Roxy',VOLCOM:'Volcom',HAWAIIAN:'Hawaiian',VEECE:'VEECE',ONEILL:"O'Neill",REEF:'Reef',HUBBLITE:'Hubblite',OTRA:''};
const marca=t=>{const u=t.toUpperCase();for(const m of MARCAS)if(u.includes(m))return m;return 'OTRA'};
const QUITA=/^(Lente|Polo Manga Larga|Polo|Short Ropa de Baño|Short|Bikini|Gorra|Sombrero|Sandalia|Zapatilla|Aquashoes|Mochila|Canguro|Bolso de playa|Bolso|Billetera|Cartuchera|Lanyard portallaves|Licra|Tabla Bodyboard|Tabla MiniBody|Wetsuit|Camisa|Casaca|Jogger Pantalón|Jogger Buzo|Jogger|Polera|Bividi|Reloj|Toalla microfibra|Toalla|Sombrilla|Portalaptop|Correa)\s+/i;
function limpio(t){let s=t.replace(QUITA,'');const m=marca(t);
 if(m!=='OTRA')s=s.replace(new RegExp(m,'i'),'').trim();
 s=s.replace(/^(Hombre|Damas|Dama|Niño|Niña|Mens|Girls|Boys)\s+/i,'').replace(/\s{2,}/g,' ').trim();
 return (s||t).charAt(0).toUpperCase()+(s||t).slice(1)}
const sol=n=>n>0?('S/ '+n.toFixed(2).replace(/\.00$/,'')):'Consultar';
const CATS=Object.keys(D);

const $=id=>document.getElementById(id);
$('cat').innerHTML='<option value="">Todas las categorías</option>'+
  CATS.map(c=>`<option value="${c}">${NOM[c]||c} (${D[c].length})</option>`).join('');

function tallasDe(cat){
  const s=new Set();
  (cat?[cat]:CATS).forEach(c=>D[c].forEach(x=>(x[4]||'').split('/').filter(Boolean).forEach(t=>s.add(t.trim()))));
  const a=[...s];
  a.sort((x,y)=>{const nx=parseFloat(x),ny=parseFloat(y);
    if(!isNaN(nx)&&!isNaN(ny))return nx-ny;
    const o=['2XS','XS','S','M','L','XL','XXL'];
    const ix=o.indexOf(x.toUpperCase()),iy=o.indexOf(y.toUpperCase());
    if(ix>=0&&iy>=0)return ix-iy; if(ix>=0)return -1; if(iy>=0)return 1;
    return x.localeCompare(y)});
  return a;
}
function marcasDe(cat){
  const s=new Set();
  (cat?[cat]:CATS).forEach(c=>D[c].forEach(x=>s.add(marca(x[0]))));
  return [...s].filter(m=>m!=='OTRA');
}
function refrescarFiltros(){
  const c=$('cat').value;
  $('tal').innerHTML='<option value="">Cualquier talla</option>'+tallasDe(c).map(t=>`<option>${t}</option>`).join('');
  $('mar').innerHTML='<option value="">Todas las marcas</option>'+marcasDe(c).map(m=>`<option value="${m}">${BON[m]}</option>`).join('');
  buscar();
}
let SEL=[];
function buscar(){
  const c=$('cat').value, t=$('tal').value.trim().toUpperCase(), m=$('mar').value;
  const r=[];
  (c?[c]:CATS).forEach(cc=>D[cc].forEach((x,i)=>{
    if(m && marca(x[0])!==m) return;
    if(t){const ts=(x[4]||'').split('/').map(s=>s.trim().toUpperCase()); if(!ts.includes(t))return;}
    r.push({c:cc,i,x,on:true});
  }));
  r.sort((a,b)=>b.x[1]-a.x[1]);
  SEL=r; pintar();
}
function pintar(){
  const n=SEL.filter(s=>s.on).length;
  $('cuenta').innerHTML = SEL.length
    ? `<b>${n}</b> de ${SEL.length} productos marcados. Toca una foto para quitarla.`
    : 'No hay productos con esos filtros.';
  $('go').disabled = n===0;
  $('prev').innerHTML = SEL.map((s,k)=>`<div class="c ${s.on?'':'off'}" data-k="${k}">
    <span class="x">${s.on?'×':'+'}</span>

$('go').onclick=async()=>{
  const items=SEL.filter(s=>s.on);
  const por=+$('por').value;
  const c=$('cat').value, t=$('tal').value, m=$('mar').value;
  let titulo = (m?BON[m]+' · ':'') + (c?NOM[c]:'Productos') + (t?' · talla '+t:'');
  $('hojas').innerHTML='<div class="cargando">Armando las fotos…</div>';
  const grupos=[]; for(let i=0;i<items.length;i+=por) grupos.push(items.slice(i,i+por));
  const out=[];
  for(let i=0;i<grupos.length;i++){
    const cv=await hoja(grupos[i], titulo, i+1, grupos.length);
    out.push(await new Promise(r=>cv.toBlob(r,'image/jpeg',0.88)));
  }
  $('hojas').innerHTML = out.map((b,i)=>{
    const u=URL.createObjectURL(b);
    const nom=`oneill-${(titulo.replace(/[^a-z0-9]+/gi,'-')).toLowerCase()}-${i+1}.jpg`;
    return `<div class="hoja"><img src="${u}" alt="">
      <div class="acc">
        <a class="btn b-neg" href="${u}" download="${nom}">Descargar</a>
        <button class="btn b-wa" data-i="${i}" data-n="${nom}">Compartir por WhatsApp</button>
      </div>
      <p class="nota">${(grupos[i]||[]).length} productos · ${Math.round(b.size/1024)} KB</p></div>`;
  }).join('');
  document.querySelectorAll('.hoja .b-wa').forEach(btn=>btn.onclick=async()=>{
    const b=out[+btn.dataset.i];
    const f=new File([b], btn.dataset.n, {type:'image/jpeg'});
    if(navigator.canShare && navigator.canShare({files:[f]})){
      try{ await navigator.share({files:[f], text:titulo}); }catch(e){}
    } else { alert('En este navegador no se puede compartir directo. Usa "Descargar" y adjunta la foto en WhatsApp.'); }
  });
};
refrescarFiltros();
</script>
</body>
