name: Descargar fotos del catalogo

# Baja las fotos de los productos desde el CDN de Shopify y las guarda
# dentro de este repositorio, para que la pagina no dependa de la tienda.
# Se dispara solo cuando cambia lista-fotos.txt, o a mano desde Actions.

on:
  workflow_dispatch:
  push:
    paths:
      - 'lista-fotos.txt'
      - '.github/workflows/descargar-fotos.yml'

permissions:
  contents: write

concurrency:
  group: descargar-fotos
  cancel-in-progress: false

jobs:
  descargar:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Descargar las fotos que falten
        run: |
          set -u
          BASE="https://cdn.shopify.com/s/files/1/0617/8180/3180"
          ANCHO=1000
          mkdir -p fotos/files fotos/products
          # OJO: las fotos del repositorio estan optimizadas (760 px, JPEG q78
          # o WebP cuando tienen fondo transparente) y algunas cambiaron de
          # extension. Si vuelves a correr esto, revisa despues el peso total:
          # GitHub Pages aborta el despliegue si el sitio pesa demasiado.
          # Con 70 MB fallo; con 28 MB funciona.

          bajar() {
            ruta="$1"
            destino="fotos/$ruta"
            sinext="fotos/${ruta%.*}"
            # Ya la tenemos si existe en cualquiera de sus formas: la original
            # o la optimizada, que puede haber cambiado de extension.
            if [ -s "$destino" ] || [ -s "$sinext.jpg" ] || [ -s "$sinext.webp" ]; then
              echo "ok-cache $ruta"
              return 0
            fi
            mkdir -p "$(dirname "$destino")"
            if curl -sfL --retry 3 --retry-delay 2 --max-time 60 \
                 "$BASE/$ruta?width=$ANCHO" -o "$destino.tmp"; then
              if [ -s "$destino.tmp" ]; then
                mv "$destino.tmp" "$destino"
                # Apuntamos solo las nuevas: son las unicas que se optimizan.
                echo "$destino" >> nuevas.txt
                echo "ok $ruta"
                return 0
              fi
            fi
            rm -f "$destino.tmp"
            echo "FALLO $ruta" >> fallos.txt
            return 0
          }
          export -f bajar
          export BASE ANCHO

          : > fallos.txt
          : > nuevas.txt
          # 8 descargas en paralelo
          tr -d '\r' < lista-fotos.txt | grep -v '^[[:space:]]*$' \
            | xargs -I{} -P 8 bash -c 'bajar "$@"' _ {} > /dev/null

          echo "=== Resultado ==="
          echo "archivos descargados: $(find fotos -type f | wc -l)"
          echo "peso total: $(du -sh fotos | cut -f1)"
          if [ -s fallos.txt ]; then
            echo "FALLARON $(wc -l < fallos.txt):"
            cat fallos.txt
          else
            echo "sin fallos"
            rm -f fallos.txt
          fi

      - name: Descargar la foto de portada en grande
        run: |
          set -u
          mkdir -p fotos/portada
          if [ ! -s fotos/portada/banner.jpg ]; then
            curl -sfL --retry 3 --max-time 90 \
              "https://cdn.shopify.com/s/files/1/0617/8180/3180/files/Banner_Shopify_3.jpg?width=2000" \
              -o fotos/portada/banner.jpg
          fi
          if [ ! -s fotos/portada/lentes-agua.jpg ]; then
            curl -sfL --retry 3 --max-time 90 \
              "https://cdn.shopify.com/s/files/1/0617/8180/3180/files/71107017_2851571394871533_1208185085027680256_n.jpg?width=1600" \
              -o fotos/portada/lentes-agua.jpg
          fi
          if [ ! -s fotos/portada/preview.jpg ]; then
            curl -sfL --retry 3 --max-time 90 \
              "https://cdn.shopify.com/s/files/1/0617/8180/3180/files/Banner_Shopify_3.jpg?width=1200" \
              -o fotos/portada/preview.jpg
          fi
          ls -lh fotos/portada

      - name: Optimizar las fotos nuevas
        run: |
          if [ ! -s nuevas.txt ]; then
            echo "No bajamos ninguna foto nueva: no hay nada que optimizar."
            exit 0
          fi
          python3 -m pip install --quiet --upgrade Pillow
          python3 - <<'PY'
          # Deja cada foto nueva a 760 px de ancho y en JPEG q78, para que el
          # sitio no se pase del peso que GitHub Pages acepta (con 70 MB el
          # despliegue falla; con 28 MB funciona).
          #
          # DOS REGLAS QUE NO SE TOCAN:
          #  1. Solo se optimizan las fotos bajadas en esta corrida
          #     (nuevas.txt). Las que ya estan en el repositorio NO se tocan:
          #     la pagina las nombra una por una y si les cambias la extension
          #     se rompen 50 fotos de golpe. Ya paso una vez.
          #  2. Todas salen en .jpg, sin excepcion. Una sola extension para
          #     todo el catalogo: nada que adivinar ni que se desincronice.
          #     Las transparentes se aplanan sobre el gris del fondo del sitio.
          from PIL import Image
          import os
          MAX = 760
          FONDO = (245, 245, 243)   # --hum del sitio, el gris de las fichas
          for p in [l.strip() for l in open('nuevas.txt') if l.strip()]:
              if not os.path.isfile(p) or '/portada/' in p:
                  continue
              base, _ = os.path.splitext(p)
              destino = base + '.jpg'
              try:
                  im = Image.open(p)
              except Exception as e:
                  print('no se pudo abrir', p, e)
                  continue
              if im.width > MAX:
                  im = im.resize((MAX, round(im.height * MAX / im.width)), Image.LANCZOS)
              if im.mode in ('RGBA', 'LA') or (im.mode == 'P' and 'transparency' in im.info):
                  fondo = Image.new('RGB', im.size, FONDO)
                  im = im.convert('RGBA')
                  fondo.paste(im, mask=im.split()[-1])
                  im = fondo
              im.convert('RGB').save(destino, 'JPEG', quality=78,
                                     optimize=True, progressive=True)
              if destino != p:
                  os.remove(p)
              print('optimizada', destino)
          PY
          rm -f nuevas.txt
          echo "peso final: $(du -sh fotos | cut -f1)"

      - name: Guardar en el repositorio
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add fotos fallos.txt 2>/dev/null || git add fotos
          if git diff --cached --quiet; then
            echo "No hay fotos nuevas que guardar."
          else
            git commit -m "Guarda las fotos del catalogo en el repositorio"
            git push
          fi
